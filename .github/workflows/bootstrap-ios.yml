name: Bootstrap iOS platform

# One-shot: generates the native ios/ scaffold (App.xcodeproj, Podfile,
# shared scheme) via `npx cap add ios` on a macOS runner, then commits it
# to this branch. Safe to re-run — skips itself if ios/ already exists.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-ios
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate ios/ scaffold
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS platform
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcodeproj ]; then
            echo "iOS platform already present — nothing to bootstrap"
            exit 0
          fi
          # cap add requires webDir to exist; a placeholder is enough,
          # the real dist/ arrives with the mirror push from the source repo.
          mkdir -p dist
          echo "bootstrap placeholder" > dist/index.html
          npx cap add ios
          cp setup/GoogleService-Info.plist ios/App/App/

      - name: Commit iOS platform
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain ios)" ]; then
            echo "No ios/ changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git commit -m "Add iOS platform scaffold (cap add ios)"
          git push
