name: Build iOS (unsigned)

# Compiles the Sena iOS app WITHOUT code signing (no Apple Developer
# account yet). Produces a sena-ios-unsigned-<sha> artifact containing
# the zipped Release-iphoneos .app bundle. Phase 3 (signed .ipa) will
# reuse this job adding certificate + provisioning profile secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild unsigned
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The real dist/ arrives with the mirror push from the source repo;
      # keep manual/dispatch runs working with a placeholder until then.
      - name: Ensure dist/ exists
        run: |
          set -euo pipefail
          if [ ! -f dist/index.html ]; then
            echo "No dist/ yet (mirror not run) — using placeholder"
            mkdir -p dist
            echo "placeholder" > dist/index.html
          fi

      # Copy dist/ into the native project + refresh pods (Podfile plugin
      # block and Podfile.lock are already committed from bootstrap).
      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build .app without code signing
        working-directory: ios/App
        run: |
          set -euo pipefail
          ARGS=(
            -scheme App
            -configuration Release
            -destination 'generic/platform=iOS'
            -derivedDataPath build
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace "${ARGS[@]}" build
          else
            xcodebuild -project App.xcodeproj "${ARGS[@]}" build
          fi

      - name: Package .app
        working-directory: ios/App/build/Build/Products/Release-iphoneos
        run: zip -qry sena-ios-unsigned.zip App.app

      # Keep only the newest artifact (same policy as the Android job
      # in the private repo's deploy.yml).
      - name: Delete previous iOS artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const perPage = 100;
            let page = 1;
            let deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: perPage, page,
              });
              const stale = data.artifacts.filter(a =>
                a.name.startsWith('sena-ios-unsigned-') && !a.expired
              );
              for (const a of stale) {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: a.id,
                });
                deleted += 1;
                core.info(`Deleted artifact ${a.name} (id=${a.id})`);
              }
              if (data.artifacts.length < perPage) break;
              page += 1;
            }
            core.info(`Total sena-ios-unsigned artifacts deleted: ${deleted}`);

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sena-ios-unsigned-${{ github.sha }}
          path: ios/App/build/Build/Products/Release-iphoneos/sena-ios-unsigned.zip
          retention-days: 7
